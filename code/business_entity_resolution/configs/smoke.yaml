# Tiny end-to-end run to catch bugs (runs on a laptop in a few minutes).
# Build the data first:  python src/run.py --config configs/smoke.yaml --stage make_smoke
base: base.yaml
run_name: smoke

paths:
  data_dir: work/smoke_data
  output_dir: work/smoke_output

smoke:
  source_data_dir: dataset
  # Records whose address contains one of these strings are kept, so blocks keep
  # realistic local competition (decoys, other S1s) instead of random rows.
  regions: [", VT", "Vermont", "Goa", "Talence"]

data:
  train_s1_frac: 1.0

blocking:
  s1_chunk: 50000

features:
  n_jobs: 1
  chunk_size: 50000
  part_rows: 100000

model:
  n_folds: 2
  num_boost_round: 300
  early_stopping_rounds: 30
  params:
    num_leaves: 31
    min_data_in_leaf: 20
    num_threads: 4
